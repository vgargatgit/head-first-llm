name: Clean residual pattern prose

on:
  push:
    branches: [main]
    paths:
      - scripts/cleanup-pattern-01-prose.py
      - .github/workflows/cleanup-pattern-01-prose.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[pattern-01 prose cleaned]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/cleanup-pattern-01-prose.py
      - name: Commit cleanup and remove one-time files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/cleanup-pattern-01-prose.py .github/workflows/cleanup-pattern-01-prose.yml
          git add src/chapter-07.md
          git commit -m "docs: polish residual pattern prose [pattern-01 prose cleaned]"
          git push origin HEAD:main
