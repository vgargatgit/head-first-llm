name: Implement and validate COH-2.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-coh-2-1.yml'

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add the Chapter 1 positional scaffold
        run: |
          echo '' | base64 --decode > /tmp/coh21_patch.py
          python /tmp/coh21_patch.py

      - name: Validate the positional scaffold
        run: |
          echo '' | base64 --decode > /tmp/coh21_validate.py
          python /tmp/coh21_validate.py
          node scripts/check-book-consistency.mjs

      - name: Commit COH-2.1
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/chapter-01.md docs/inference-loop-scene-master-plan.md docs/stories.md
          git commit -m 'Add Chapter 1 positional scaffold'
          git push
