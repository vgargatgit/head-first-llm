name: Apply and validate COH-2.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-coh-2-2.yml'

permissions:
  contents: write

jobs:
  terminology-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded terminology changes
        run: python .github/scripts/coh-2-2.py

      - name: Validate book structure and navigation
        run: node scripts/check-book-consistency.mjs

      - name: Check patch formatting
        run: git diff --check

      - name: Commit completed story
        run: |
          rm .github/scripts/coh-2-2.py
          rm .github/workflows/complete-coh-2-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/chapter-02.md src/chapter-03.md src/chapter-04.md src/chapter-05.md src/chapter-06.md src/chapter-07.md src/chapter-08.md docs/stories.md .github/scripts/coh-2-2.py .github/workflows/complete-coh-2-2.yml
          git diff --cached --quiet && { echo 'No COH-2.2 changes were produced.'; exit 1; }
          git commit -m 'Standardise positional wording across Chapters 2–8'
          git push
