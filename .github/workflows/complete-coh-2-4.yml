name: Apply and validate COH-2.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-coh-2-4.yml'

permissions:
  contents: write

jobs:
  integrate-position-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded position-bridge integration
        run: python .github/scripts/coh-2-4.py

      - name: Validate book structure and navigation
        run: node scripts/check-book-consistency.mjs

      - name: Validate SVG reference and XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          asset = Path('assets/chapter-01/05_position_bridge.svg')
          ET.parse(asset)
          chapter = Path('src/chapter-01.md').read_text(encoding='utf-8')
          assert chapter.count('../assets/chapter-01/05_position_bridge.svg') == 1
          print('Position bridge SVG and Chapter 1 reference are valid.')
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Commit completed story
        run: |
          rm .github/scripts/coh-2-4.py
          rm .github/workflows/complete-coh-2-4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/chapter-01.md docs/inference-loop-scene-master-plan.md docs/stories.md assets/chapter-01/05_position_bridge.svg docs/chapter-01/position-bridge-scene-plan.md .github/scripts/coh-2-4.py .github/workflows/complete-coh-2-4.yml
          git diff --cached --quiet && { echo 'No COH-2.4 changes were produced.'; exit 1; }
          git commit -m 'Integrate Chapter 1 position bridge illustration'
          git push
