name: Apply and validate COH-2.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-coh-2-5.yml'

permissions:
  contents: write

jobs:
  continuity-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded continuity changes
        run: python .github/scripts/coh-2-5.py

      - name: Validate book structure and navigation
        run: node scripts/check-book-consistency.mjs

      - name: Check patch formatting
        run: git diff --check

      - name: Commit completed story
        run: |
          rm .github/scripts/coh-2-5.py
          rm .github/workflows/complete-coh-2-5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/chapter-08.md src/chapter-09.md src/chapter-10.md docs/stories.md .github/scripts/coh-2-5.py .github/workflows/complete-coh-2-5.yml
          git diff --cached --quiet && { echo 'No COH-2.5 changes were produced.'; exit 1; }
          git commit -m 'Align Chapter 8 to 10 continuity'
          git push
