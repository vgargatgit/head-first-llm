name: Apply and validate COH-3.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-coh-3-1.yml'

permissions:
  contents: write

# Trigger after workflow registration on main.
jobs:
  create-running-example-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate ledger and verifier
        run: python .github/scripts/coh-3-1.py

      - name: Validate verifier syntax
        run: node --check scripts/verify-running-example.mjs

      - name: Verify canonical running example
        run: node scripts/verify-running-example.mjs

      - name: Validate book structure and navigation
        run: node scripts/check-book-consistency.mjs

      - name: Check patch formatting
        run: git diff --check

      - name: Commit completed story
        run: |
          rm .github/scripts/coh-3-1.py
          rm .github/workflows/complete-coh-3-1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/running-example-ledger.md scripts/verify-running-example.mjs README.md .github/workflows/pages.yml docs/stories.md .github/scripts/coh-3-1.py .github/workflows/complete-coh-3-1.yml
          git diff --cached --quiet && { echo 'No COH-3.1 changes were produced.'; exit 1; }
          git commit -m 'Create canonical running-example ledger'
          git push
