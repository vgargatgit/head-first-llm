name: Finalize Chapter 4 graphics

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.issue.title == '[automation] Finalize Chapter 4 graphics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align asset paths and production records
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path('site/app.js')
          text = app.read_text(encoding='utf-8')
          text = text.replace("const BUILD_VERSION = '20260727.7';", "const BUILD_VERSION = '20260728.1';")
          old = "4: { title: 'When Queries Meet Keys', source: 'src/chapter-04.md', assetFrom: [], assetTo: '', assetAliases: {} },"
          new = "4: { title: 'When Queries Meet Keys', source: 'src/chapter-04.md', assetFrom: ['../assets/chapter-04/', '/assets/chapter-04/'], assetTo: 'assets/chapter-04/', assetAliases: {} },"
          if old not in text and new not in text: raise SystemExit('Chapter 4 registry entry not found')
          app.write_text(text.replace(old, new), encoding='utf-8')

          plan = Path('docs/chapter-04/chapter-04-scene-plan.md')
          p = plan.read_text(encoding='utf-8')
          for i, name in enumerate([
            'chapter_hero_matching_desk', 'query_key_dot_product', 'full_score_matrix',
            'scale_by_sqrt_dk', 'causal_mask_by_row', 'rowwise_softmax',
            'attention_weight_matrix', 'scores_are_not_payloads_or_explanations'
          ], 1):
            p = p.replace(f'assets/chapter-04/{i:02d}_{name}.png', f'assets/chapter-04/{i:02d}_{name}.svg')
            p = p.replace(f'`{i:02d}_{name}.png`', f'`{i:02d}_{name}.svg`')
          plan.write_text(p, encoding='utf-8')

          Path('.github/workflows/finalize-chapter-04-graphics.yml').unlink()
          PY
      - name: Validate and commit
        run: |
          grep -q "BUILD_VERSION = '20260728.1'" site/app.js
          grep -q "../assets/chapter-04/" site/app.js
          ! grep -q 'assets/chapter-04/.*\.png' docs/chapter-04/chapter-04-scene-plan.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Chapter 4 graphics paths'
          git push
