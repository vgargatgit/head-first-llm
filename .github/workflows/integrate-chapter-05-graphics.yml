name: Integrate Chapter 5 graphics

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.issue.title == '[automation] Integrate Chapter 5 graphics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate approved Chapter 5 assets
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          chapter_path = root / 'src/chapter-05.md'
          chapter = chapter_path.read_text(encoding='utf-8')

          blocks = {
              'hero': '''<!-- chapter-05-art:hero:start -->\n![SAT brings the Chapter 4 attention report to the Information Courier, while THE, CAT, and SAT wait beside their separate Value packages.](../assets/chapter-05/01_chapter_hero_information_courier.webp){.hero}\n<!-- chapter-05-art:hero:end -->\n\n''',
              'projection': '''<!-- chapter-05-art:value-projection:start -->\n![A hidden-state card passes through the shared Value projection and becomes a two-coordinate Value package, while Query, Key, and Value are shown as different projections of the same state.](../assets/chapter-05/02_value_projection_pipeline.webp)\n<!-- chapter-05-art:value-projection:end -->\n\n''',
              'exact-value': '''<!-- chapter-05-art:exact-value:start -->\n![SAT's four hidden-state coordinates are multiplied by the Value projection matrix to produce the Value vector negative 0.423 and 0.001.](../assets/chapter-05/03_exact_value_calculation.webp)\n<!-- chapter-05-art:exact-value:end -->\n\n''',
              'shared': '''<!-- chapter-05-art:shared-projection:start -->\n![THE, CAT, and SAT use the same Value projection but leave the packing station with different Value packages that form the matrix V.](../assets/chapter-05/04_shared_value_projection.webp)\n<!-- chapter-05-art:shared-projection:end -->\n\n''',
              'weighted': '''<!-- chapter-05-art:weighted-retrieval:start -->\n![SAT's three attention weights scale the Value packages from THE, CAT, and SAT, and the scaled vectors are added into the head output negative 0.145069 and 0.163369.](../assets/chapter-05/05_weighted_value_retrieval.webp)\n<!-- chapter-05-art:weighted-retrieval:end -->\n\n''',
              'matrix': '''<!-- chapter-05-art:output-matrix:start -->\n![The three-by-three attention matrix multiplies the three-by-two Value matrix to produce one two-coordinate output row for each token position.](../assets/chapter-05/06_attention_output_matrix.webp)\n<!-- chapter-05-art:output-matrix:end -->\n\n''',
              'handoff': '''<!-- chapter-05-art:handoff:start -->\n![A correction panel distinguishes Key profiles used for matching from Value packages used as payload, then sends the completed one-head report toward the multi-head specialist wing.](../assets/chapter-05/07_key_vs_value_and_handoff.webp)\n<!-- chapter-05-art:handoff:end -->\n\n''',
          }

          def insert_before(needle, block, marker):
              global chapter
              if marker in chapter:
                  return
              if needle not in chapter:
                  raise SystemExit(f'Missing chapter heading: {needle}')
              chapter = chapter.replace(needle, block + needle, 1)

          def insert_after_heading(heading, block, marker):
              global chapter
              if marker in chapter:
                  return
              needle = heading + '\n'
              if needle not in chapter:
                  raise SystemExit(f'Missing chapter heading: {heading}')
              chapter = chapter.replace(needle, needle + '\n' + block, 1)

          insert_before('# The question this chapter answers', blocks['hero'], 'chapter-05-art:hero:start')
          insert_before('# What a Value is', blocks['projection'], 'chapter-05-art:value-projection:start')
          insert_after_heading('# Exact Value calculation for SAT', blocks['exact-value'], 'chapter-05-art:exact-value:start')
          insert_after_heading('# One Value projection, many tokens', blocks['shared'], 'chapter-05-art:shared-projection:start')
          insert_after_heading('# Exact attention output for SAT', blocks['weighted'], 'chapter-05-art:weighted-retrieval:start')
          insert_after_heading('# All weighted sums in one matrix multiplication', blocks['matrix'], 'chapter-05-art:output-matrix:start')
          insert_before('# Coming next: many heads, one result', blocks['handoff'], 'chapter-05-art:handoff:start')
          chapter_path.write_text(chapter, encoding='utf-8')

          plan_path = root / 'docs/chapter-05/chapter-05-scene-plan.md'
          plan = plan_path.read_text(encoding='utf-8')
          plan = re.sub(r'(assets/chapter-05/[a-z0-9_]+)\.png', r'\1.webp', plan)
          plan = plan.replace('- Final artwork generation: not started.', '- Final artwork generation: complete for all seven approved WebP scenes.')
          plan = plan.replace('- Asset integration into the chapter: not started.', '- Asset integration into the chapter: complete.')
          plan = plan.replace('- Website and mobile review: pending final artwork.', '- Website and mobile review: pending deployed preview review.')
          plan_path.write_text(plan, encoding='utf-8')

          app_path = root / 'site/app.js'
          app = app_path.read_text(encoding='utf-8')
          app = re.sub(r"const BUILD_VERSION = '[^']+';", "const BUILD_VERSION = '20260728.5';", app, count=1)
          old_chapter = "5: { title: 'Meet the Information Courier', source: 'src/chapter-05.md', assetFrom: [], assetTo: '', assetAliases: {} }"
          new_chapter = "5: { title: 'Meet the Information Courier', source: 'src/chapter-05.md', assetFrom: ['../assets/chapter-05/', '/assets/chapter-05/'], assetTo: 'assets/chapter-05/', assetAliases: {} }"
          if old_chapter in app:
              app = app.replace(old_chapter, new_chapter, 1)
          elif new_chapter not in app:
              raise SystemExit('Could not update Chapter 5 reader mapping')
          app_path.write_text(app, encoding='utf-8')

          for relative in ('site/chapter.html', 'site/index.html'):
              path = root / relative
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'20260728\.\d+', '20260728.5', text)
              path.write_text(text, encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          heading = '## 2026-07-28 — Chapter 5 graphics added'
          if heading not in changelog:
              entry = '''## 2026-07-28 — Chapter 5 graphics added\n\n- Added seven approved WebP scenes under `assets/chapter-05/`.\n- Introduced the Information Courier and the reusable Value-package, packing-station, and weighted-mixing visual system.\n- Integrated the hero, Value projection, exact SAT calculation, shared projection, weighted retrieval, full `A × V` matrix, and Chapter 6 handoff into the manuscript.\n- Activated Chapter 5 assets in the website reader and refreshed the site cache version.\n- Updated the Chapter 5 production plan.\n\n'''
              anchor = '## 2026-07-28 — Chapter 4 graphics added'
              if anchor not in changelog:
                  raise SystemExit('Could not find changelog insertion point')
              changelog = changelog.replace(anchor, entry + anchor, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          workflow = root / '.github/workflows/integrate-chapter-05-graphics.yml'
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Validate integration
        run: |
          for asset in \
            01_chapter_hero_information_courier \
            02_value_projection_pipeline \
            03_exact_value_calculation \
            04_shared_value_projection \
            05_weighted_value_retrieval \
            06_attention_output_matrix \
            07_key_vs_value_and_handoff; do
            test -f "assets/chapter-05/${asset}.webp"
          done
          test "$(grep -c 'chapter-05-art:.*:start' src/chapter-05.md)" -eq 7
          test "$(grep -c 'assets/chapter-05/.*\.webp' src/chapter-05.md)" -eq 7
          grep -q "BUILD_VERSION = '20260728.5'" site/app.js
          grep -q "assetTo: 'assets/chapter-05/'" site/app.js
          grep -q '20260728.5' site/chapter.html
          grep -q '20260728.5' site/index.html
          test ! -f .github/workflows/integrate-chapter-05-graphics.yml

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Chapter 5 graphics'
          git push
