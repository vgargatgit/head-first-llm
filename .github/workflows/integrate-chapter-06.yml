name: Integrate Chapter 6 graphics

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: github.event.issue.title == '[automation] Integrate Chapter 6 graphics'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Move assets and integrate Chapter 6
        run: |
          set -euo pipefail

          nested='assets/chapter-06/assets/chapter-06'
          target='assets/chapter-06'
          test -d "$nested"
          mkdir -p "$target"
          mv "$nested"/*.webp "$target"/
          rmdir "$nested"
          rmdir 'assets/chapter-06/assets'

          python <<'PY'
          from pathlib import Path

          chapter_path = Path('src/chapter-06.md')
          text = chapter_path.read_text(encoding='utf-8')

          def insert_before(anchor: str, block: str) -> None:
              global text
              if block.strip() in text:
                  return
              if anchor not in text:
                  raise RuntimeError(f'Missing Chapter 6 anchor: {anchor}')
              text = text.replace(anchor, block + '\n\n' + anchor, 1)

          hero = '''<!-- chapter-06-art:hero:start -->
          ![THE, CAT, and SAT send the same hidden-state matrix into two complete attention-head specialist agencies, each with its own learned projections and attention pipeline.](../assets/chapter-06/01_chapter_hero_two_attention_heads.webp){.hero}
          <!-- chapter-06-art:hero:end -->'''
          if hero.strip() not in text:
              marker = '---\n\n# The question this chapter answers'
              if marker not in text:
                  raise RuntimeError('Missing front-matter anchor')
              text = text.replace('---\n\n# The question this chapter answers', '---\n\n' + hero + '\n\n# The question this chapter answers', 1)

          insert_before(
              '# One head is one complete attention system',
              '''<!-- chapter-06-art:one-head:start -->
          ![A complete Head 1 blueprint shows its own Query, Key, and Value projections, score calculation, scaling, causal mask, row-wise softmax, Value retrieval, and two-coordinate output.](../assets/chapter-06/02_one_head_complete_pipeline.webp)
          <!-- chapter-06-art:one-head:end -->'''
          )

          insert_before(
              "# Calculate Head 2's Queries",
              '''<!-- chapter-06-art:head2-calculation:start -->
          ![Head 2 projects the same input into different Query, Key, and Value vectors, then computes SAT's raw compatibility score with THE as 0.092696.](../assets/chapter-06/03_head2_exact_calculation.webp)
          <!-- chapter-06-art:head2-calculation:end -->'''
          )

          insert_before(
              "# Head 2's attention weights",
              '''<!-- chapter-06-art:attention-maps:start -->
          ![Head 1 and Head 2 obey the same causal visibility rule but assign different attention weights to THE, CAT, and SAT, with both SAT rows highlighted for comparison.](../assets/chapter-06/04_two_attention_maps.webp)
          <!-- chapter-06-art:attention-maps:end -->'''
          )

          insert_before(
              '# Put the two head outputs side by side',
              '''<!-- chapter-06-art:head-outputs:start -->
          ![Two Information Couriers deliver separate Head 1 and Head 2 reports to SAT: negative 0.145069 and 0.163369 from Head 1, and 0.228069 and negative 0.100593 from Head 2.](../assets/chapter-06/05_two_head_outputs.webp)
          <!-- chapter-06-art:head-outputs:end -->'''
          )

          insert_before(
              '# Concatenation preserves token rows',
              '''<!-- chapter-06-art:concatenation:start -->
          ![A feature binder joins each token's two Head 1 coordinates beside its two Head 2 coordinates, preserving THE, CAT, and SAT rows while producing the three-by-four matrix H.](../assets/chapter-06/06_concatenate_head_reports.webp)
          <!-- chapter-06-art:concatenation:end -->'''
          )

          insert_before(
              '# Chapter takeaway',
              '''<!-- chapter-06-art:packed-handoff:start -->
          ![Separate conceptual head projections are compared with one packed matrix multiplication and reshape; misconception panels reject splitting tokens or sharing one softmax, and the concatenated report H is delivered to the Chapter 7 Team Lead.](../assets/chapter-06/07_packed_multihead_projection_and_handoff.webp)
          <!-- chapter-06-art:packed-handoff:end -->'''
          )

          if text.count('../assets/chapter-06/') != 7:
              raise RuntimeError(f'Expected 7 Chapter 6 image references, found {text.count("../assets/chapter-06/")}')
          chapter_path.write_text(text, encoding='utf-8')

          app_path = Path('site/app.js')
          app = app_path.read_text(encoding='utf-8')
          app = app.replace("const BUILD_VERSION = '20260728.5';", "const BUILD_VERSION = '20260728.6';")
          old_chapter = "6: { title: 'Many Specialists at Work', source: 'src/chapter-06.md', assetFrom: [], assetTo: '', assetAliases: {} },"
          new_chapter = "6: { title: 'Many Specialists at Work', source: 'src/chapter-06.md', assetFrom: ['../assets/chapter-06/', '/assets/chapter-06/'], assetTo: 'assets/chapter-06/', assetAliases: {} },"
          if old_chapter not in app and new_chapter not in app:
              raise RuntimeError('Missing Chapter 6 reader mapping')
          app = app.replace(old_chapter, new_chapter)
          app_path.write_text(app, encoding='utf-8')

          for path_string in ['site/chapter.html', 'site/index.html']:
              path = Path(path_string)
              body = path.read_text(encoding='utf-8')
              body = body.replace('20260728.5', '20260728.6')
              path.write_text(body, encoding='utf-8')

          plan_path = Path('docs/chapter-06/chapter-06-scene-plan.md')
          plan = plan_path.read_text(encoding='utf-8')
          plan = plan.replace('- Final artwork generation: not started.', '- Final artwork generation: complete for all seven approved WebP scenes.')
          plan = plan.replace('- Asset integration into the chapter: not started.', '- Asset integration into the chapter: complete.')
          plan = plan.replace('- Website and mobile review: pending final artwork.', '- Website and mobile review: pending deployed preview review.')
          plan_path.write_text(plan, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '''## 2026-07-28 — Chapter 6 graphics added

          - Added seven approved WebP scenes under `assets/chapter-06/`.
          - Introduced the two Head Specialist agencies, persistent head badges, feature binder, and packed-projection visual system.
          - Integrated the hero, complete one-head pipeline, exact Head 2 score calculation, two attention maps, two retrieved reports, feature concatenation, and Chapter 7 Team Lead handoff into the manuscript.
          - Activated Chapter 6 assets in the website reader and refreshed the site cache version.
          - Updated the Chapter 6 production plan.

          '''
          if '## 2026-07-28 — Chapter 6 graphics added' not in changelog:
              anchor = 'All notable changes to **LLMs from the Inside Out** are recorded here.\n\n'
              if anchor not in changelog:
                  raise RuntimeError('Missing changelog insertion anchor')
              changelog = changelog.replace(anchor, anchor + entry, 1)
          changelog_path.write_text(changelog, encoding='utf-8')
          PY

          for file in \
            01_chapter_hero_two_attention_heads.webp \
            02_one_head_complete_pipeline.webp \
            03_head2_exact_calculation.webp \
            04_two_attention_maps.webp \
            05_two_head_outputs.webp \
            06_concatenate_head_reports.webp \
            07_packed_multihead_projection_and_handoff.webp; do
            test -s "assets/chapter-06/$file"
          done

          grep -q "BUILD_VERSION = '20260728.6'" site/app.js
          grep -q "assetTo: 'assets/chapter-06/'" site/app.js
          grep -q 'chapter-06-art:packed-handoff:start' src/chapter-06.md

      - name: Commit integration and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-chapter-06.yml
          git add assets/chapter-06 src/chapter-06.md site/app.js site/chapter.html site/index.html docs/chapter-06/chapter-06-scene-plan.md CHANGELOG.md
          git commit -m 'Integrate Chapter 6 graphics'
          git push origin main

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed
