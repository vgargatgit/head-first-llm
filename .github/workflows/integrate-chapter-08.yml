name: Integrate Chapter 8 graphics

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  integrate:
    if: github.event.issue.title == '[automation] Integrate Chapter 8 graphics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Run validated integration
        run: |
          set -euo pipefail
          python scripts/integrate_chapter_08.py
          for file in assets/chapter-08/0*.png; do test -s "$file"; done
          test "$(find assets/chapter-08 -maxdepth 1 -name '0*.png' | wc -l | tr -d ' ')" -eq 8
          test "$(grep -c '../assets/chapter-08/' src/chapter-08.md)" -eq 8
          grep -Fq "assetTo: 'assets/chapter-08/'" site/app.js
          grep -Fq 'Chapter 8 graphics added' CHANGELOG.md

      - name: Commit integration and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/integrate-chapter-08.yml scripts/integrate_chapter_08.py
          git add src/chapter-08.md site/app.js site/chapter.html site/index.html docs/chapter-08/chapter-08-scene-plan.md CHANGELOG.md assets/chapter-08
          git commit -m 'Integrate Chapter 8 graphics'
          git push origin main

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed
