name: Mark COH-1.4 complete

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mark-coh-1-4-complete.yml'

permissions:
  contents: write

jobs:
  update-story-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark COH-1.4 complete
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/stories.md')
          text = path.read_text(encoding='utf-8')
          needle = '## COH-1.4 — Align repository documentation with the five-part structure\n\n**Status:** Planned'
          replacement = '## COH-1.4 — Align repository documentation with the five-part structure\n\n**Status:** Complete'

          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'Expected one COH-1.4 planned-status block, found {count}.')

          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Commit backlog status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/stories.md
          git commit -m 'Mark COH-1.4 complete'
          git push
