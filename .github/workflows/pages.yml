name: Deploy LLMs from the Inside Out website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded COH-3.1 migration
        run: |
          python .github/scripts/coh-3-1.py
          node --check scripts/verify-running-example.mjs
          node scripts/verify-running-example.mjs
          node scripts/check-book-consistency.mjs
          git diff --check
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pages.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('  contents: write\n', '  contents: read\n', 1)
          start = text.index('      - name: Apply guarded COH-3.1 migration\n')
          end = text.index('      - name: Validate authentication script\n', start)
          text = text[:start] + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/scripts/coh-3-1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/running-example-ledger.md scripts/verify-running-example.mjs README.md .github/workflows/pages.yml docs/stories.md .github/scripts/coh-3-1.py
          git diff --cached --quiet && { echo 'No COH-3.1 changes were produced.'; exit 1; }
          git commit -m 'Create canonical running-example ledger'
          git push

      - name: Validate authentication script
        run: node --check site/auth.js

      - name: Validate book structure and navigation
        run: node scripts/check-book-consistency.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble static website
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp -R src _site/src
          cp -R assets _site/assets
          touch _site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
