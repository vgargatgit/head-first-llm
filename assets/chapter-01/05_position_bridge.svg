<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">The position bridge from token identity to the initial hidden state</title><desc id="desc">SAT carries a token embedding card E. A Position Registrar supplies an address card P. The two same-width cards combine into an initial hidden-state passport X zero, which SAT carries into the first attention block. A note says this additive view is one teaching model and other architectures inject position differently.</desc><defs><filter id="paper" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="7" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="mono"/><feComponentTransfer in="mono" result="faint"><feFuncA type="table" tableValues="0 0.035"/></feComponentTransfer><feBlend in="SourceGraphic" in2="faint" mode="multiply"/></filter><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#33243f" flood-opacity="0.16"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#6b3fa0"/></marker><style> .ink { stroke:#202020; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; } .thin { stroke:#202020; stroke-width:3.5; stroke-linecap:round; stroke-linejoin:round; } .hand { font-family:"Comic Sans MS","Trebuchet MS",sans-serif; } .body { font-family:"Trebuchet MS",Arial,sans-serif; } </style></defs><rect width="1536" height="1024" rx="26" fill="#fff8e9" filter="url(#paper)"/><rect x="24" y="24" width="1488" height="976" rx="30" fill="none" stroke="#6b3fa0" stroke-width="5"/><path d="M48 45 Q160 24 270 48 L260 112 Q160 125 52 108 Z" fill="#6b3fa0" opacity="0.95"/><text x="158" y="88" text-anchor="middle" font-size="40" font-weight="700" fill="#fff" class="hand">CHAPTER 1</text><text x="785" y="82" text-anchor="middle" font-size="68" font-weight="800" fill="#202020" class="hand">THE POSITION BRIDGE</text><text x="785" y="126" text-anchor="middle" font-size="27" font-weight="600" fill="#6b3fa0" class="body">How token identity and position prepare the state that enters attention</text><path d="M360 146 Q770 130 1174 147" fill="none" stroke="#6b3fa0" stroke-width="5" stroke-linecap="round" opacity="0.8"/><rect x="55" y="184" width="410" height="604" rx="34" fill="#f2e8fb" stroke="#6b3fa0" stroke-width="4"/><rect x="96" y="160" width="328" height="66" rx="22" fill="#6b3fa0"/><text x="260" y="205" text-anchor="middle" font-size="34" font-weight="800" fill="#fff" class="hand">TOKEN IDENTITY</text><g transform="translate(92 310) rotate(-1)"><ellipse cx="132" cy="368" rx="98" ry="24" fill="#d7cbb8" opacity="0.55"/><rect x="44" y="30" width="176" height="274" rx="50" fill="#ffd84d" class="ink"/><ellipse cx="98" cy="104" rx="27" ry="34" fill="#fff" class="thin"/><ellipse cx="165" cy="104" rx="27" ry="34" fill="#fff" class="thin"/><circle cx="108" cy="112" r="11" fill="#202020"/><circle cx="174" cy="112" r="11" fill="#202020"/><path d="M108 168 Q132 193 158 168" fill="#f06d5f" class="thin"/><text x="132" y="252" text-anchor="middle" font-size="66" font-weight="900" fill="#202020" class="hand">SAT</text><path d="M52 264 Q12 292 16 332" fill="none" class="ink"/><circle cx="17" cy="335" r="18" fill="#fff" class="thin"/><path d="M214 260 Q258 273 279 248" fill="none" class="ink"/><circle cx="282" cy="246" r="18" fill="#fff" class="thin"/><path d="M84 304 L80 350" fill="none" class="ink"/><path d="M178 304 L184 350" fill="none" class="ink"/><path d="M52 350 Q86 338 112 354 Q84 377 52 365 Z" fill="#ffd84d" class="thin"/><path d="M154 354 Q188 338 216 356 Q188 378 155 369 Z" fill="#ffd84d" class="thin"/></g><g transform="translate(252 278) rotate(4)"><rect width="176" height="246" rx="22" fill="#fffdf6" stroke="#202020" stroke-width="4"/><rect x="14" y="15" width="148" height="48" rx="13" fill="#ffdca8" stroke="#202020" stroke-width="3"/><text x="88" y="48" text-anchor="middle" font-size="25" font-weight="800" class="body">TOKEN CARD</text><text x="88" y="116" text-anchor="middle" font-size="74" font-weight="900" fill="#6b3fa0" class="body">E</text><text x="88" y="158" text-anchor="middle" font-size="28" font-weight="800" class="hand">SAT</text><path d="M30 184 H146 M30 207 H146" stroke="#8b7b69" stroke-width="3" stroke-linecap="round"/><text x="88" y="237" text-anchor="middle" font-size="19" fill="#5f4d3d" class="body">identity + meaning</text></g><text x="260" y="748" text-anchor="middle" font-size="23" font-weight="700" fill="#4f2f79" class="body">The token supplies its embedding.</text><path d="M484 485 C535 485 548 485 587 485" fill="none" stroke="#6b3fa0" stroke-width="10" marker-end="url(#arrow)"/><rect x="588" y="184" width="398" height="604" rx="34" fill="#eef6e7" stroke="#66824e" stroke-width="4"/><rect x="628" y="160" width="318" height="66" rx="22" fill="#66824e"/><text x="787" y="205" text-anchor="middle" font-size="32" font-weight="800" fill="#fff" class="hand">POSITION REGISTRAR</text><path d="M625 576 Q787 546 949 576 L935 718 Q787 738 640 716 Z" fill="#c98f57" stroke="#202020" stroke-width="5"/><rect x="665" y="555" width="244" height="72" rx="15" fill="#fff1c9" stroke="#202020" stroke-width="4"/><text x="787" y="600" text-anchor="middle" font-size="28" font-weight="800" class="hand">ADDRESS DESK</text><g transform="translate(674 250)"><ellipse cx="112" cy="136" rx="74" ry="94" fill="#f4c7a1" class="ink"/><path d="M45 119 Q40 20 112 15 Q194 22 181 128 Q163 72 112 72 Q66 73 45 119 Z" fill="#7045a0" class="ink"/><ellipse cx="83" cy="131" rx="17" ry="23" fill="#fff" class="thin"/><ellipse cx="140" cy="131" rx="17" ry="23" fill="#fff" class="thin"/><circle cx="89" cy="137" r="7" fill="#202020"/><circle cx="146" cy="137" r="7" fill="#202020"/><path d="M83 179 Q112 202 143 177" fill="#f06d5f" class="thin"/><path d="M51 215 Q112 185 174 215 L190 324 H34 Z" fill="#6b3fa0" class="ink"/><path d="M60 222 L164 222" stroke="#fff" stroke-width="8" stroke-linecap="round"/><circle cx="112" cy="256" r="26" fill="#fff8e9" stroke="#202020" stroke-width="3"/><path d="M112 237 C93 237 86 252 86 264 C86 283 112 300 112 300 C112 300 138 283 138 264 C138 252 131 237 112 237 Z" fill="#e86f78" transform="scale(.7) translate(48 92)"/></g><g transform="translate(830 335) rotate(-8)"><rect width="150" height="194" rx="24" fill="#eadcf7" stroke="#202020" stroke-width="4"/><path d="M75 28 C42 28 29 51 29 72 C29 111 75 151 75 151 C75 151 121 111 121 72 C121 51 108 28 75 28 Z" fill="#6b3fa0" stroke="#202020" stroke-width="3"/><circle cx="75" cy="72" r="20" fill="#fff8e9" stroke="#202020" stroke-width="3"/><text x="75" y="177" text-anchor="middle" font-size="30" font-weight="900" fill="#4f2f79" class="body">P₃</text></g><path d="M853 440 Q825 458 799 481" fill="none" stroke="#202020" stroke-width="5" stroke-linecap="round"/><circle cx="796" cy="484" r="18" fill="#fff" class="thin"/><text x="787" y="739" text-anchor="middle" font-size="20" font-weight="700" fill="#54703e" class="body"><tspan x="787">The architecture makes</tspan><tspan x="787" dy="28">position available.</tspan></text><path d="M1005 485 C1046 485 1068 485 1104 485" fill="none" stroke="#6b3fa0" stroke-width="10" marker-end="url(#arrow)"/><rect x="1105" y="184" width="376" height="604" rx="34" fill="#fff0e6" stroke="#d06d5a" stroke-width="4"/><rect x="1144" y="160" width="299" height="66" rx="22" fill="#d06d5a"/><text x="1294" y="205" text-anchor="middle" font-size="27" font-weight="800" fill="#fff" class="hand">READY FOR ATTENTION</text><g transform="translate(1156 266) rotate(-2)"><rect width="274" height="338" rx="28" fill="#fffdf6" stroke="#202020" stroke-width="5"/><rect x="18" y="18" width="238" height="62" rx="15" fill="#6b3fa0"/><text x="137" y="58" text-anchor="middle" font-size="28" font-weight="800" fill="#fff" class="body">INITIAL STATE</text><text x="137" y="150" text-anchor="middle" font-size="74" font-weight="900" fill="#d06d5a" class="body">X⁽⁰⁾</text><rect x="34" y="184" width="206" height="46" rx="15" fill="#ffdca8" stroke="#202020" stroke-width="3"/><text x="137" y="216" text-anchor="middle" font-size="24" font-weight="800" class="body">TOKEN IDENTITY</text><text x="137" y="257" text-anchor="middle" font-size="36" font-weight="900" fill="#6b3fa0" class="body">+</text><rect x="34" y="270" width="206" height="46" rx="15" fill="#eadcf7" stroke="#202020" stroke-width="3"/><text x="137" y="301" text-anchor="middle" font-size="24" font-weight="800" class="body">POSITION</text></g><g transform="translate(1215 655)"><path d="M0 108 V36 Q0 0 38 0 H120 Q158 0 158 36 V108" fill="#d8c5eb" stroke="#202020" stroke-width="5"/><rect x="16" y="26" width="126" height="82" rx="8" fill="#f6effc" stroke="#202020" stroke-width="4"/><circle cx="118" cy="70" r="7" fill="#d06d5a"/><text x="79" y="57" text-anchor="middle" font-size="19" font-weight="800" class="body">FIRST</text><text x="79" y="86" text-anchor="middle" font-size="18" font-weight="800" class="body">ATTENTION BLOCK</text></g><path d="M1294 615 V655" fill="none" stroke="#6b3fa0" stroke-width="8" marker-end="url(#arrow)"/><rect x="74" y="824" width="1388" height="118" rx="30" fill="#fffdf6" stroke="#6b3fa0" stroke-width="4"/><circle cx="137" cy="883" r="39" fill="#6b3fa0"/><text x="137" y="896" text-anchor="middle" font-size="33" font-weight="900" fill="#fff" class="body">E+P</text><text x="210" y="871" font-size="27" font-weight="800" fill="#202020" class="body">One common additive teaching model:</text><text x="1180" y="875" text-anchor="end" font-size="48" font-weight="900" fill="#6b3fa0" class="body">X⁽⁰⁾ = E + P</text><text x="210" y="915" font-size="23" font-weight="600" fill="#5f4d3d" class="body">Some architectures inject position differently. Chapter 9 compares the main approaches.</text><circle cx="1400" cy="883" r="35" fill="#eef6e7" stroke="#66824e" stroke-width="4"/><path d="M1382 882 L1396 897 L1422 866" fill="none" stroke="#66824e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>