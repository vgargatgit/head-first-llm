<text x="72" y="45" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#4b277d">SCALE BY √dₖ</text><text x="72" y="65" font-size="17" fill="#17151a">Keep dot-product logits in a manageable range</text>
<g font-family="Arial,sans-serif" fill="#17151a"><g><rect x="40" y="110" width="185" height="235" rx="25" fill="#4b277d" stroke="#17151a" stroke-width="4"/><text x="132" y="155" text-anchor="middle" font-size="22" font-weight="800" fill="white">SCALE</text><text x="132" y="184" text-anchor="middle" font-size="22" font-weight="800" fill="white">CALIBRATOR</text><circle cx="132" cy="255" r="55" fill="#fff0b6" stroke="#17151a" stroke-width="4"/><path d="M132,255 L174,225" stroke="#d84b4b" stroke-width="6"/><circle cx="132" cy="255" r="8" fill="#17151a"/></g><rect x="260" y="105" width="420" height="85" rx="14" fill="white" stroke="#17151a" stroke-width="3"/><text x="470" y="140" text-anchor="middle" font-size="22">scale factor = 1 / √dₖ = 1 / √2</text><text x="470" y="175" text-anchor="middle" font-size="27" font-weight="800" fill="#4b277d">≈ 0.707107</text><rect x="365" y="220" width="95" height="42" rx="8" fill="#d9ef9f" stroke="#17151a"/><text x="412.5" y="249" text-anchor="middle" font-size="13" font-weight="700">THE</text><rect x="460" y="220" width="95" height="42" rx="8" fill="#d9ef9f" stroke="#17151a"/><text x="507.5" y="249" text-anchor="middle" font-size="13" font-weight="700">CAT</text><rect x="555" y="220" width="95" height="42" rx="8" fill="#d9ef9f" stroke="#17151a"/><text x="602.5" y="249" text-anchor="middle" font-size="13" font-weight="700">SAT</text><rect x="270" y="262" width="95" height="42" rx="8" fill="#eadcf8" stroke="#17151a"/><text x="317.5" y="289" text-anchor="middle" font-size="13" font-weight="700">THE</text><rect x="365" y="262" width="95" height="42" fill="white" stroke="#777"/><text x="412.5" y="289" text-anchor="middle" font-size="13">−0.055495</text><rect x="460" y="262" width="95" height="42" fill="white" stroke="#777"/><text x="507.5" y="289" text-anchor="middle" font-size="13">0.050009</text><rect x="555" y="262" width="95" height="42" fill="white" stroke="#777"/><text x="602.5" y="289" text-anchor="middle" font-size="13">−0.032205</text><rect x="270" y="304" width="95" height="42" rx="8" fill="#eadcf8" stroke="#17151a"/><text x="317.5" y="331" text-anchor="middle" font-size="13" font-weight="700">CAT</text><rect x="365" y="304" width="95" height="42" fill="white" stroke="#777"/><text x="412.5" y="331" text-anchor="middle" font-size="13">−0.062809</text><rect x="460" y="304" width="95" height="42" fill="white" stroke="#777"/><text x="507.5" y="331" text-anchor="middle" font-size="13">0.045571</text><rect x="555" y="304" width="95" height="42" fill="white" stroke="#777"/><text x="602.5" y="331" text-anchor="middle" font-size="13">−0.162225</text><rect x="270" y="346" width="95" height="42" rx="8" fill="#eadcf8" stroke="#17151a"/><text x="317.5" y="373" text-anchor="middle" font-size="13" font-weight="700">SAT</text><rect x="365" y="346" width="95" height="42" fill="white" stroke="#777"/><text x="412.5" y="373" text-anchor="middle" font-size="13">−0.137716</text><rect x="460" y="346" width="95" height="42" fill="white" stroke="#777"/><text x="507.5" y="373" text-anchor="middle" font-size="13">0.121348</text><rect x="555" y="346" width="95" height="42" fill="white" stroke="#777"/><text x="602.5" y="373" text-anchor="middle" font-size="13">−0.111316</text><text x="475" y="420" text-anchor="middle" font-size="16">Every cell is divided by the same positive number, so row ordering is preserved.</text></g></svg>