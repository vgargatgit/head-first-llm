<svg xmlns="http://www.w3.org/2000/svg" width="920" height="455" viewBox="0 0 920 455">
<rect width="920" height="455" rx="20" fill="#fbf5e8" stroke="#17151a" stroke-width="3"/><rect x="18" y="16" width="42" height="42" rx="8" fill="#4b277d"/><text x="39" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="white">8</text>
<text x="72" y="45" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#4b277d">NOT PAYLOADS. NOT EXPLANATIONS.</text><text x="72" y="65" font-size="17" fill="#17151a">Attention weights are mechanism signals, not complete interpretations</text>
<g font-family="Arial,sans-serif" fill="#17151a"><rect x="40" y="105" width="400" height="125" rx="16" fill="white" stroke="#17151a" stroke-width="3"/><circle cx="78" cy="143" r="19" fill="#d84b4b"/><path d="M68,133 L88,153 M88,133 L68,153" stroke="white" stroke-width="5"/><text x="112" y="143" font-size="19" font-weight="800">Scores are not probabilities.</text><text x="112" y="177" font-size="15">Softmax converts logits into weights.</text><rect x="480" y="105" width="400" height="125" rx="16" fill="white" stroke="#17151a" stroke-width="3"/><circle cx="518" cy="143" r="19" fill="#d84b4b"/><path d="M508,133 L528,153 M528,133 L508,153" stroke="white" stroke-width="5"/><text x="552" y="143" font-size="19" font-weight="800">Negative does not mean blocked.</text><text x="552" y="177" font-size="15">Only the causal mask creates forbidden positions.</text><rect x="40" y="255" width="400" height="125" rx="16" fill="white" stroke="#17151a" stroke-width="3"/><circle cx="78" cy="293" r="19" fill="#d84b4b"/><path d="M68,283 L88,303 M88,283 L68,303" stroke="white" stroke-width="5"/><text x="112" y="293" font-size="19" font-weight="800">Keys are not Values.</text><text x="112" y="327" font-size="15">Keys match; Values carry information.</text><rect x="480" y="255" width="400" height="125" rx="16" fill="white" stroke="#17151a" stroke-width="3"/><circle cx="518" cy="293" r="19" fill="#d84b4b"/><path d="M508,283 L528,303 M528,283 L508,303" stroke="white" stroke-width="5"/><text x="552" y="293" font-size="19" font-weight="800">Attention is not a full explanation.</text><text x="552" y="327" font-size="15">Later heads, MLPs, residuals, and layers still matter.</text><text x="460" y="425" text-anchor="middle" font-size="18" font-weight="700" fill="#4b277d">Remove the costumes: A = softmax(QKᵀ/√dₖ + M)</text></g></svg>